<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Text & Border Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-node {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .orbit-particle {
      animation: float 6s ease-in-out infinite alternate;
    }
    .scan-line {
      animation: scan 5s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(6px); }
      100% { transform: translateY(4px) translateX(-4px); }
    }
    @keyframes scan {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Matrix Grid -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="720" y1="0" x2="720" y2="360" />
    <line x1="840" y1="0" x2="840" y2="360" />
    <line x1="960" y1="0" x2="960" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
  </g>

  <!-- Floating Dynamic Tech Cards / Badges in the deep background (Lower opacity so text stays readable) -->
  <g class="orbit-particle" opacity="0.35">
    <rect x="70" y="45" width="170" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="92" cy="66" r="6" fill="#10b981" />
    <text x="108" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd" letter-spacing="0.5">DNS VERIFIED ✓</text>
  </g>

  <g class="orbit-particle" opacity="0.35" style="animation-delay: -2s;">
    <rect x="970" y="55" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="992" cy="76" r="6" fill="#c084fc" />
    <text x="1008" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e9d5ff" letter-spacing="0.5">OIDC TRUSTED 🛡️</text>
  </g>

  <g class="orbit-particle" opacity="0.3" style="animation-delay: -4s;">
    <rect x="80" y="275" width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="102" cy="296" r="6" fill="#818cf8" />
    <text x="118" y="301" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">CRYPTO PROOF 🔑</text>
  </g>

  <g class="orbit-particle" opacity="0.3" style="animation-delay: -1.5s;">
    <rect x="955" y="270" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" />
    <circle cx="977" cy="291" r="6" fill="#34d399" />
    <text x="993" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" letter-spacing="0.5">EV VALIDATION 🔒</text>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="300" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />
  <circle cx="900" cy="180" r="140" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Laser Scan Bar -->
  <g class="scan-line">
    <line x1="0" y1="0" x2="0" y2="360" stroke="url(#textGrad)" stroke-width="2" />
  </g>

  <!-- Centered Verification Shield Motif in background -->
  <g transform="translate(600, 85)" text-anchor="middle">
    <!-- Outer Shield Halo -->
    <path d="M 0 -35 L 32 -18 L 32 16 C 32 36 0 54 0 54 C 0 54 -32 36 -32 16 L -32 -18 Z" 
          fill="none" stroke="url(#badgeGrad)" stroke-width="2.5" opacity="0.7" filter="url(#shieldGlow)">
      <animate attributeName="stroke-dasharray" values="1,15; 15,1; 1,15" dur="6s" repeatCount="indefinite" />
    </path>
    <!-- Checkmark in Shield -->
    <path d="M -12 7 L -4 15 L 14 -5" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT (Always crisp, prominent and unobstructed) -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <rect x="460" y="145" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="600" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ENTERPRISE TRUST &amp; SECURITY
    </text>

    <!-- Main Title -->
    <text x="600" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Verified Publisher &amp; Team Identity
    </text>

    <!-- Subtitle -->
    <text x="600" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Landscape of Domain Ownership, Cryptographic Attestation &amp; Publisher Verification
    </text>

    <!-- Metadata Badges / Tags -->
    <g transform="translate(600, 275)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      <rect x="-240" y="8" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="-167" y="25" fill="#cbd5e1" font-weight="500">🏢 SaaS Benchmarks</text>

      <rect x="-80" y="8" width="160" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="25" fill="#cbd5e1" font-weight="500">⚡ Open Source Tools</text>

      <rect x="95" y="8" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="167" y="25" fill="#cbd5e1" font-weight="500">🔐 Zero-Trust Identity</text>
    </g>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
</svg>
